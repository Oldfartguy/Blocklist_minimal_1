name: Keepalive

on:
  schedule:
    # Chạy mỗi giờ, 00:00 UTC
    - cron: '0 * * * *'
  workflow_dispatch:   # Cho phép bấm chạy tay

jobs:
  keepalive:
    name: Keepalive (chống khóa 60 ngày)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Append keepalive log (reset sau 3600 dòng)
        run: |
          touch .keepalive
          LINES=$(wc -l < .keepalive)
          if [ "$LINES" -ge 3600 ]; then
            echo "$(date -u) [reset]" > .keepalive
          else
            echo "$(date -u)" >> .keepalive
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git diff --cached --quiet || git commit -m "keepalive $(date +%Y-%m-%d)"
          git push
